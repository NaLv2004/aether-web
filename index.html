<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether - Fully Automated Communication Research</title>
    <link rel="preconnect" href="https://gs.jurieo.com/gemini/fonts-googleapis">
    <link rel="preconnect" href="https://gs.jurieo.com/gemini/fonts-gstatic" crossorigin>
    <link href="https://gs.jurieo.com/gemini/fonts-googleapis/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ================= 基础样式与重置 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 顶部导航栏 ================= */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }
        .logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .nav-links a {
            color: #a1a1aa;
            text-decoration: none;
            margin-left: 30px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
            cursor: pointer;
        }
        .nav-links a:hover { color: #ffffff; }

        /* ================= 宇宙星空背景层 ================= */
        #particles-js {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            z-index: 1;
        }

        /* ================= 主内容区 ================= */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 0 20px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: -0.03em;
        }

        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 800px;
            margin-top: 20px;
        }

        .pill-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e4e4e7;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-family: inherit;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pill-btn:hover {
            border-color: rgba(255, 255, 255, 0.8);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* ================= 终端模拟器 (替换原有的 hero-card) ================= */
        .hero-card {
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            margin-top: 50px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            height: 400px; /* 固定高度以便滚动 */
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        /* 终端顶部小圆点装饰 */
        .terminal-header {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .terminal-dot {
            width: 12px; height: 12px; border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        /* 终端滚动区 */
        .terminal-body {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        /* 隐藏滚动条但保留功能 */
        .terminal-body::-webkit-scrollbar { width: 6px; }
        .terminal-body::-webkit-scrollbar-track { background: transparent; }
        .terminal-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }

        /* 聊天行样式 */
        .chat-line { margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
        .user-line { color: #4ade80; /* 绿色代表用户 */ }
        .aether-line { color: #e4e4e7; /* 灰色代表Aether输出 */ }
        .system-line { color: #60a5fa; /* 蓝色代表系统动作/计划 */ }
        .action-line { color: #facc15; /* 黄色代表具体执行动作 */ }

        .prompt-symbol { font-weight: bold; margin-right: 8px; }
        .user-prompt { color: #4ade80; }
        .aether-prompt { color: #a1a1aa; }

        /* 闪烁的光标 */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #ffffff;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ================= 弹窗与文档样式 (保持不变) ================= */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 100;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: #09090b; border: 1px solid rgba(255, 255, 255, 0.15); width: 90%; max-width: 800px;
            padding: 40px; border-radius: 16px; position: relative; text-align: left;
            animation: popup 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popup {
            from { transform: scale(0.95) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .close-btn { position: absolute; top: 20px; right: 25px; font-size: 1.2rem; color: #a1a1aa; cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: #fff; }
        .modal-title { font-size: 1.8rem; font-weight: 600; margin-bottom: 20px; }
        .modal-body { display: flex; gap: 30px; align-items: flex-start; }
        .modal-image { width: 50%; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .modal-desc { width: 50%; line-height: 1.6; color: #a1a1aa; font-size: 0.95rem; }
        
        .docs-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); z-index: 200;
            overflow-y: auto; padding: 40px 20px;
        }
        .docs-container {
            background: #09090b; border: 1px solid rgba(255, 255, 255, 0.1); max-width: 800px;
            margin: 40px auto; padding: 50px; border-radius: 16px; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-docs-btn {
            position: fixed; top: 30px; right: 50px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px 20px; border-radius: 30px;
            cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; z-index: 201;
        }
        .markdown-body { color: #d4d4d8; line-height: 1.7; font-size: 1rem; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">A E T H E R</div>
        <div class="nav-links">
            <a href="#">System</a>
            <a onclick="openDocs()">Docs</a>
            <a href="#">About</a>
        </div>
    </nav>

    <div id="particles-js"></div>

    <div class="container">
        <h1>Aether: Towards Fully Automated Communication Research</h1>
        
        <div class="options-container">
            <button class="pill-btn" onclick="openModal('brainstorm')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Brainstorm Ideas</button>
            <button class="pill-btn" onclick="openModal('code')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg> Generate Code</button>
            <button class="pill-btn" onclick="openModal('experiments')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg> Perform Experiments</button>
            <button class="pill-btn" onclick="openModal('review')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Review an Article</button>
            <button class="pill-btn" onclick="openModal('respond')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg> Respond to Reviews</button>
        </div>

        <div class="hero-card">
            <div class="terminal-header">
                <div class="terminal-dot dot-red"></div>
                <div class="terminal-dot dot-yellow"></div>
                <div class="terminal-dot dot-green"></div>
            </div>
            <div class="terminal-body" id="terminal-body">
                </div>
        </div>
    </div>

    <div class="modal-overlay" id="myModal">...</div>
    <div class="docs-overlay" id="docsOverlay">...</div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <script>
        // --- 粒子星空背景逻辑 ---
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 150 },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": true, "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false } },
                "size": { "value": 2, "random": true },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 0.3, "direction": "none", "random": true, "out_mode": "out" }
            },
            "interactivity": { "events": { "onhover": { "enable": false }, "onclick": { "enable": false } } },
            "retina_detect": true
        });

        // ================= 终端模拟交互逻辑 =================
        const terminalBody = document.getElementById('terminal-body');

        // 定义对话剧本
        const script = [
            // 场景 1: Brainstorm
            { type: 'aether', text: "Aether Agent Deployment Ready.\nSystem initialized.", speed: 20, delay: 500 },
            { type: 'aether', text: "what theme do you want to study?", speed: 30, delay: 800 },
            { type: 'user', text: "cell free MIMO detection", speed: 50, delay: 1500 },
            { type: 'system', text: "[Agent System] Instantiating parallel student agents...", speed: 10, delay: 500 },
            { type: 'system', text: "[Student Agent 1] Brainstorming complete. Generated 4 ideas.\n[Student Agent 2] Brainstorming complete. Generated 3 ideas.", speed: 20, delay: 1000 },
            { type: 'system', text: "[Agent System] Submitting 7 ideas to Teacher Agent for critical review...", speed: 20, delay: 800 },
            { type: 'aether', text: "Review complete. Filtered down to top 2 concepts.\nWhich idea do you want to proceed with?", speed: 30, delay: 1500 },
            
            // 场景 2: Generate Code & Respond
            { type: 'user', text: "respond to the comments in review.txt", speed: 50, delay: 2500 },
            { type: 'system', text: "Entering plan mode...", speed: 30, delay: 500 },
            { type: 'system', text: "Plan Generated:\n1. Read review.txt\n2. Run baseline simulation for comparison\n3. Write rebuttal response based on simulation results", speed: 15, delay: 800 },
            { type: 'user', text: "Approved. Execute plan.", speed: 40, delay: 1500 },
            
            // 逐步执行计划
            { type: 'system', text: "[Thought] I need to extract the exact criticisms from the reviewer.", speed: 30, delay: 500 },
            { type: 'action', text: ">> Action: read_file('review.txt')", speed: 15, delay: 200 },
            
            { type: 'system', text: "[Thought] The reviewer asked for BER performance under imperfect CSI. I will write and run the code.", speed: 30, delay: 1200 },
            { type: 'action', text: ">> Action: run_code('ber_simulation.py')", speed: 15, delay: 200 },
            { type: 'system', text: "Code executed successfully. Validation data captured.", speed: 10, delay: 1500 },
            
            { type: 'system', text: "[Thought] I have the data. Now drafting the response document.", speed: 30, delay: 800 },
            { type: 'action', text: ">> Action: write_file('rebuttal.pdf')", speed: 15, delay: 200 },
            
            { type: 'aether', text: "Task completed successfully. Waiting for next instruction...", speed: 30, delay: 1500 },
            { type: 'clear', delay: 3000 } // 清屏并重新开始
        ];

        // 打字机效果函数
        function typeWriter(text, element, speed) {
            return new Promise(resolve => {
                let i = 0;
                element.innerHTML = ''; // 清空当前节点
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        // 每次输入后自动滚动到底部
                        terminalBody.scrollTop = terminalBody.scrollHeight;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        // 睡眠函数（用于控制对话间隔）
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 运行剧本主循环
        async function runTerminalSimulation() {
            while (true) { // 无限循环
                for (let step of script) {
                    if (step.type === 'clear') {
                        await sleep(step.delay);
                        terminalBody.innerHTML = '';
                        continue;
                    }

                    await sleep(step.delay);

                    // 创建新的一行
                    const lineDiv = document.createElement('div');
                    lineDiv.className = `chat-line`;
                    
                    // 根据发言者设置样式前缀
                    let prefix = '';
                    let textClass = '';
                    if (step.type === 'user') {
                        prefix = '<span class="prompt-symbol user-prompt">you@aether:~$</span>';
                        textClass = 'user-line';
                    } else if (step.type === 'aether') {
                        prefix = '<span class="prompt-symbol aether-prompt">aether></span>';
                        textClass = 'aether-line';
                    } else if (step.type === 'system') {
                        prefix = '<span class="prompt-symbol aether-prompt">system></span>';
                        textClass = 'system-line';
                    } else if (step.type === 'action') {
                        textClass = 'action-line';
                    }

                    lineDiv.innerHTML = `${prefix}<span class="${textClass} text-content"></span><span class="cursor"></span>`;
                    terminalBody.appendChild(lineDiv);
                    
                    const textContainer = lineDiv.querySelector('.text-content');
                    const cursor = lineDiv.querySelector('.cursor');

                    // 执行打字
                    await typeWriter(step.text, textContainer, step.speed);
                    
                    // 打字完成后移除当前行的光标
                    cursor.remove();
                }
            }
        }

        // 页面加载完成后启动模拟器
        window.addEventListener('DOMContentLoaded', () => {
            runTerminalSimulation();
        });

        // 弹窗逻辑保持不变 (为节省空间这里省略了原生 js，如果需要可以粘贴回原逻辑)
        // ... (openModal / openDocs 等逻辑无需改动)
    </script>
</body>
</html>
